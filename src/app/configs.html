<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Configurações — SMLurker</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/configs.css">
</head>

<body>
    <div class="container">
        <header class="titlebar">
            <h1>Configurações</h1>
            <div class="window-controls" aria-label="Controles da janela">
                <button name="minWindow" class="window-control" type="button" aria-label="Minimizar" title="Minimizar">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12" /></svg>
                </button>
                <button name="closeWindow" class="window-control window-control-close" type="button" aria-label="Fechar" title="Fechar">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
                </button>
            </div>
        </header>

        <div name="loading" aria-live="polite"></div>

        <main class="config-content">
            <div class="config-heading">
                <span class="config-eyebrow">PREFERÊNCIAS</span>
                <h2>Inicialização</h2>
                <p>Escolha como o SMLurker deve abrir e conectar.</p>
            </div>

            <section class="settings-card" aria-label="Opções de inicialização">
                <label class="setting-row">
                    <span class="setting-copy">
                        <strong>Iniciar com Windows</strong>
                        <small>Abra o aplicativo ao ligar o computador.</small>
                    </span>
                    <input type="checkbox" class="switch" id="swt_ini">
                    <span class="switch-track" aria-hidden="true"></span>
                </label>
                <label class="setting-row">
                    <span class="setting-copy">
                        <strong>Conectar automaticamente</strong>
                        <small>Entre nos canais ao abrir o aplicativo.</small>
                    </span>
                    <input type="checkbox" class="switch" id="swt_autologin">
                    <span class="switch-track" aria-hidden="true"></span>
                </label>
                <label class="setting-row">
                    <span class="setting-copy">
                        <strong>Iniciar minimizado</strong>
                        <small>Requer a conexão automática ativada.</small>
                    </span>
                    <input type="checkbox" class="switch" id="swt_inimin">
                    <span class="switch-track" aria-hidden="true"></span>
                </label>
            </section>

            <section class="file-actions" aria-label="Arquivos e dados">
                <div class="section-heading">
                    <span class="config-eyebrow">ARQUIVOS E DADOS</span>
                </div>
                <button class="file-action" name="abrirLocal" type="button">
                    <span class="action-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
                    </span>
                    <span class="action-copy"><strong>Local dos arquivos</strong><small>Abra a pasta de configurações.</small></span>
                    <span class="action-arrow" aria-hidden="true">↗</span>
                </button>
                <button class="file-action" name="exportarLista" type="button">
                    <span class="action-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h4M9 13h6M9 17h6" /></svg>
                    </span>
                    <span class="action-copy"><strong>Exportar lista em TXT</strong><small>Salve uma cópia dos seus canais.</small></span>
                    <span class="action-arrow" aria-hidden="true">↗</span>
                </button>
            </section>

            <button class="release-link" name="githubChange" type="button" title="Registro de alterações">
                Ver novidades e versões <span aria-hidden="true">↗</span>
            </button>
        </main>
    </div>
    <script src="../components/configs/configs.js"></script>
</body>

</html>
