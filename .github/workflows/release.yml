name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: SMLurkerApp

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x

    - name: Install dependencies
      run: npm ci

    - name: Check tag and package version
      run: |
        $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
        if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
          throw "Tag $env:GITHUB_REF_NAME does not match package.json version $packageVersion"
        }

    - name: Run tests
      run: npm test

    - name: Check Electron Twitch client ID
      env:
        SMELECTRON_CLIENT_ID: ${{ vars.SMELECTRON_CLIENT_ID }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:SMELECTRON_CLIENT_ID)) {
          throw "SMELECTRON_CLIENT_ID is not configured in the SMLurkerApp environment"
        }

    - name: Build and publish Windows release
      run: npm run release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SMELECTRON_CLIENT_ID: ${{ vars.SMELECTRON_CLIENT_ID }}
