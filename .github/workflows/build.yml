name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build Windows packages
      run: npm run build -- --publish never
